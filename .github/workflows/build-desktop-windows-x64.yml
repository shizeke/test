name: Build DSH Desktop Windows x64

on:
  push:
    branches:
      - dsh-desktop-win-x64-20260922
    paths:
      - .github/workflows/build-desktop-windows-x64.yml

permissions:
  contents: write

jobs:
  build:
    name: unsigned win-x64 installer
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Check out deepseek-harness source
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: c36a83ff6bb95e3f82cf79f9be7c724270a8aa61
          path: source
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Configure local packaging settings
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download-test.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.example.com"]}'
          '@ | Set-Content -NoNewline -Encoding UTF8 source/apps/desktop/.env.windows

      - name: Install dependencies
        working-directory: source
        shell: pwsh
        run: |
          $env:PYTHON = (Get-Command python).Source
          pnpm install --frozen-lockfile --package-import-method=clone

      - name: Build unsigned Windows x64 installer
        working-directory: source
        shell: pwsh
        run: |
          $env:PYTHON = (Get-Command python).Source
          pnpm run package:desktop:win:x64:unsigned

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64-unsigned
          path: source/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish artifact through a temporary Git branch
        shell: pwsh
        run: |
          $artifactRoot = 'source/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $archive = Join-Path $env:RUNNER_TEMP 'dsh-desktop-win-x64-unsigned.zip'
          tar.exe -a -c -f $archive -C $artifactRoot .
          $chunkRoot = 'desktop-build-artifacts'
          New-Item -ItemType Directory -Force $chunkRoot | Out-Null
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$sha256  dsh-desktop-win-x64-unsigned.zip" | Set-Content -Encoding ascii (Join-Path $chunkRoot 'SHA256SUMS')
          $chunkSize = 90MB
          $reader = [System.IO.File]::OpenRead($archive)
          try {
            $buffer = New-Object byte[] $chunkSize
            $index = 0
            while (($read = $reader.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $chunk = New-Object byte[] $read
              [Array]::Copy($buffer, $chunk, $read)
              [System.IO.File]::WriteAllBytes((Join-Path $chunkRoot ('archive-{0:D4}.bin' -f $index)), $chunk)
              $index++
            }
          }
          finally {
            $reader.Dispose()
          }
          git config user.name 'desktop-build-bot'
          git config user.email 'desktop-build-bot@users.noreply.github.com'
          git add desktop-build-artifacts
          git commit -m 'Add temporary Windows x64 desktop artifact'
          git push origin HEAD:refs/heads/dsh-desktop-win-x64-20260922-artifacts
